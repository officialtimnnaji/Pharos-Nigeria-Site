name: Update Events

on:
  schedule:
    - cron: "0 12 * * 1" # every Monday at 12:00 UTC (1PM WAT)
  workflow_dispatch: # allow manual run

jobs:
  update-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run update script
        run: node scripts/update-events.js

      - name: Commit and push changes
        run: |
          git config user.name "Pharos Bot"
          git config user.email "bot@pharosnigeria.com"
          git add src/data/events.json
          git commit -m "Auto-update events.json [skip ci]" || echo "No changes to commit"
          git push
